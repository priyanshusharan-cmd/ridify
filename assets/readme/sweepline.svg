</linearGradient>
<linearGradient id="occ" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".04"/></linearGradient><clipPath id="rev"><rect x="170" y="340" width="0" height="260"><animate attributeName="width" values="0;0;960;960" keyTimes="0;0.0500;0.8000;1" dur="12.0s" repeatCount="indefinite"/></rect></clipPath></defs>
<style>.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12.5px}.s{font-size:12px;fill:#9E9E9E}.t{font-size:14px;font-weight:700;fill:#FFFFFF}
