<text x="198" y="643" class="c6" font-size="20" font-weight="800" fill="#FFFFFF">2 / 4<tspan class="s" font-size="12" font-weight="400" dx="10">segment 6→7</tspan></text>
<text x="198" y="643" class="c7" font-size="20" font-weight="800" fill="#FFFFFF">2 / 4<tspan class="s" font-size="12" font-weight="400" dx="10">segment 7→8</tspan></text>
<text x="198" y="643" class="c8" font-size="20" font-weight="800" fill="#FFFFFF">1 / 4<tspan class="s" font-size="12" font-weight="400" dx="10">segment 8→9</tspan></text>
<text x="198" y="643" class="c9" font-size="20" font-weight="800" fill="#FFFFFF">0 / 4<tspan class="s" font-size="12" font-weight="400" dx="10">segment 9→10</tspan></text>
