<text x="48" y="58" font-size="26" font-weight="800" fill="#FFFFFF">Sweep-line seat check</text><text x="48" y="84" font-size="14" fill="#9E9E9E">Each rider occupies seats only on their slice of the route. A request is accepted if the peak load never exceeds the car.</text>
