<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Roboto, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#050505"/><stop offset=".6" stop-color="#0E0E0E"/><stop offset="1" stop-color="#121212"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.1" fill="#9E9E9E" opacity=".08"/>
</pattern>
<clipPath id="frame"><rect width="1280" height="320" rx="28"/></clipPath>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFE9A8"/><stop offset=".45" stop-color="#F5C542"/><stop offset="1" stop-color="#B8862B"/>
</linearGradient>
<linearGradient id="goldText" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
  <stop offset="0" stop-color="#F5C542"/><stop offset=".4" stop-color="#F5C542"/>
  <stop offset=".5" stop-color="#FFF6D6"/><stop offset=".6" stop-color="#F5C542"/><stop offset="1" stop-color="#F5C542"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="halo" cx="230" cy="160" r="190" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#F5C542" stop-opacity=".22"/><stop offset="1" stop-color="#F5C542" stop-opacity="0"/>
</radialGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<clipPath id="cupClip">
  <path d="M190 92 H270 V128 C270 162 252 182 230 186 C208 182 190 162 190 128 Z"/>
</clipPath>
<g id="leaf"><ellipse cx="0" cy="0" rx="7" ry="15" fill="url(#gold)"/></g>
<path id="spark" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z"/>
</defs>

<g clip-path="url(#frame)">
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <circle cx="230" cy="160" r="190" fill="url(#halo)">
    <animate attributeName="opacity" values=".6;1;.6" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- falling confetti -->
  <g opacity=".8">
    <rect x="80" y="-20" width="6" height="12" rx="1.5" fill="#F5C542">
      <animateTransform attributeName="transform" type="translate" values="0 0;30 360" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="360" y="-20" width="5" height="10" rx="1.5" fill="#FFFFFF" opacity=".7">
      <animateTransform attributeName="transform" type="translate" values="0 0;-25 360" dur="7.5s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="620" y="-20" width="6" height="12" rx="1.5" fill="#F5C542" opacity=".6">
      <animateTransform attributeName="transform" type="translate" values="0 0;20 360" dur="8s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="900" y="-20" width="5" height="10" rx="1.5" fill="#FFFFFF" opacity=".5">
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 360" dur="6.8s" begin=".6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1120" y="-20" width="6" height="12" rx="1.5" fill="#F5C542" opacity=".7">
      <animateTransform attributeName="transform" type="translate" values="0 0;25 360" dur="7.2s" begin="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="1220" y="-20" width="5" height="10" rx="1.5" fill="#FFFFFF" opacity=".6">
      <animateTransform attributeName="transform" type="translate" values="0 0;-15 360" dur="9s" begin="4.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- laurel wreath -->
  <g opacity=".95">
    <g transform="translate(230 160)">
      <use href="#leaf" transform="rotate(-160) translate(0 -92) rotate(-25)"/>
      <use href="#leaf" transform="rotate(-140) translate(0 -92) rotate(-25)"/>
      <use href="#leaf" transform="rotate(-120) translate(0 -92) rotate(-25)"/>
      <use href="#leaf" transform="rotate(-100) translate(0 -92) rotate(-25)"/>
      <use href="#leaf" transform="rotate(-80) translate(0 -92) rotate(-25)"/>
      <use href="#leaf" transform="rotate(-60) translate(0 -92) rotate(-25)"/>
      <use href="#leaf" transform="rotate(160) translate(0 -92) rotate(25)"/>
      <use href="#leaf" transform="rotate(140) translate(0 -92) rotate(25)"/>
      <use href="#leaf" transform="rotate(120) translate(0 -92) rotate(25)"/>
      <use href="#leaf" transform="rotate(100) translate(0 -92) rotate(25)"/>
      <use href="#leaf" transform="rotate(80) translate(0 -92) rotate(25)"/>
      <use href="#leaf" transform="rotate(60) translate(0 -92) rotate(25)"/>
    </g>
  </g>

  <!-- trophy (gently floats) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3.5s" repeatCount="indefinite"/>
    <path d="M190 104 C160 104 158 146 194 150" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M270 104 C300 104 302 146 266 150" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M190 92 H270 V128 C270 162 252 182 230 186 C208 182 190 162 190 128 Z" fill="url(#gold)"/>
    <rect x="222" y="184" width="16" height="20" fill="url(#gold)"/>
    <rect x="202" y="202" width="56" height="10" rx="3" fill="url(#gold)"/>
    <rect x="194" y="212" width="72" height="16" rx="4" fill="#B8862B"/>
    <text x="230" y="146" text-anchor="middle" font-size="30" font-weight="900" fill="#7A5512" opacity=".55">1</text>
    <!-- shine sweep -->
    <g clip-path="url(#cupClip)">
      <rect x="140" y="80" width="40" height="120" fill="url(#shine)" transform="skewX(-20)">
        <animate attributeName="x" values="140;360;360" keyTimes="0;.35;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- twinkling sparkles -->
  <g fill="#FFF6D6">
    <use href="#spark" x="300" y="78"><animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/></use>
    <use href="#spark" x="150" y="96"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin=".8s" repeatCount="indefinite"/></use>
    <use href="#spark" x="318" y="214"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.4s" repeatCount="indefinite"/></use>
    <use href="#spark" x="138" y="228"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="2s" repeatCount="indefinite"/></use>
  </g>

  <!-- text -->
  <g>
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    <text x="420" y="104" font-size="16" font-weight="700" letter-spacing="5" fill="#9E9E9E">AWARD WINNER</text>
    <text x="420" y="176" font-size="68" font-weight="900" fill="url(#goldText)" letter-spacing="1">BEST UI/UX</text>
    <text x="420" y="222" font-size="26" font-weight="700" fill="#FFFFFF">Hacktoberfest Hackday 26</text>
    <rect x="420" y="246" width="0" height="3" rx="1.5" fill="#F5C542">
      <animate attributeName="width" values="0;330" dur="1.6s" begin=".4s" fill="freeze"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1278" height="318" rx="27" fill="none" stroke="#F5C542" stroke-opacity=".25" stroke-width="2"/>
</g>
</svg>
