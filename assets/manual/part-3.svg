<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" font-family="Roboto, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#050505"/><stop offset=".55" stop-color="#0E0E0E"/><stop offset="1" stop-color="#121212"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.1" fill="#9E9E9E" opacity=".09"/>
</pattern>
<clipPath id="frame"><rect width="1280" height="230" rx="24"/></clipPath><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#2196F3" stop-opacity="0"/><stop offset=".5" stop-color="#2196F3"/><stop offset="1" stop-color="#2196F3" stop-opacity="0"/></linearGradient></defs>
<style>.sw{animation:sw 4s cubic-bezier(.6,0,.4,1) infinite}@keyframes sw{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}.fl{animation:fl 5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}</style>
<g clip-path="url(#frame)">
<rect width="1280" height="230" rx="24" fill="url(#bg)"/><rect width="1280" height="230" rx="24" fill="url(#dots)"/>
<rect y="0" width="1280" height="3" fill="#2196F3" fill-opacity=".25"/>
<g class="sw"><rect y="0" width="300" height="3" fill="url(#bar)"/></g>
<rect x="48" y="48" width="134" height="134" rx="26" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1.5"/><text x="115" y="132" text-anchor="middle" font-size="44" font-weight="800" fill="#2196F3" font-family="Georgia, 'Times New Roman', serif">III</text>
<text x="214" y="88" font-size="13" font-weight="700" letter-spacing="3.5" fill="#9E9E9E">PART III · CHAPTERS 6–10</text><text x="212" y="134" font-size="40" font-weight="800" letter-spacing="-1" fill="#FFFFFF">Rider's Handbook</text>
<g class="fl" style="animation-delay:-0.0s"><rect x="214" y="158" width="135" height="26" rx="13" fill="#1E1E1E" stroke="#3A3A3A"/><circle cx="227" cy="171" r="3.5" fill="#2196F3"/><text x="236" y="175.5" font-size="12.5" fill="#E0E0E0">Finding a ride</text></g>
<g class="fl" style="animation-delay:-0.5s"><rect x="356.81600000000003" y="158" width="83" height="26" rx="13" fill="#1E1E1E" stroke="#3A3A3A"/><circle cx="369.81600000000003" cy="171" r="3.5" fill="#2196F3"/><text x="378.81600000000003" y="175.5" font-size="12.5" fill="#E0E0E0">Filters</text></g>
<g class="fl" style="animation-delay:-1.0s"><rect x="448.22400000000005" y="158" width="142" height="26" rx="13" fill="#1E1E1E" stroke="#3A3A3A"/><circle cx="461.22400000000005" cy="171" r="3.5" fill="#2196F3"/><text x="470.22400000000005" y="175.5" font-size="12.5" fill="#E0E0E0">Joining &amp; fares</text></g>
<g class="fl" style="animation-delay:-1.5s"><rect x="598.384" y="158" width="98" height="26" rx="13" fill="#1E1E1E" stroke="#3A3A3A"/><circle cx="611.384" cy="171" r="3.5" fill="#2196F3"/><text x="620.384" y="175.5" font-size="12.5" fill="#E0E0E0">Live ride</text></g>
<g class="fl" style="animation-delay:-2.0s"><rect x="704.48" y="158" width="83" height="26" rx="13" fill="#1E1E1E" stroke="#3A3A3A"/><circle cx="717.48" cy="171" r="3.5" fill="#2196F3"/><text x="726.48" y="175.5" font-size="12.5" fill="#E0E0E0">Payment</text></g>
</g>
<rect x=".75" y=".75" width="1278.5" height="228.5" rx="24" fill="none" stroke="#9E9E9E" stroke-opacity=".16" stroke-width="1.5"/>
</svg>
