<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="230" viewBox="0 0 1280 230" font-family="Roboto, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#050505"/><stop offset=".55" stop-color="#0E0E0E"/><stop offset="1" stop-color="#121212"/>
</linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="1.1" fill="#9E9E9E" opacity=".09"/>
</pattern>
<clipPath id="frame"><rect width="1280" height="230" rx="24"/></clipPath><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#FFC107" stop-opacity="0"/><stop offset=".5" stop-color="#FFC107"/><stop offset="1" stop-color="#FFC107" stop-opacity="0"/></linearGradient></defs>
<style>.sw{animation:sw 4s cubic-bezier(.6,0,.4,1) infinite}@keyframes sw{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}.fl{animation:fl 5s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}</style>
<g clip-path="url(#frame)">
<rect width="1280" height="230" rx="24" fill="url(#bg)"/><rect width="1280" height="230" rx="24" fill="url(#dots)"/>
<rect y="0" width="1280" height="3" fill="#FFC107" fill-opacity=".25"/>
<g class="sw"><rect y="0" width="300" height="3" fill="url(#bar)"/></g>
<rect x="48" y="48" width="134" height="134" rx="26" fill="#1E1E1E" stroke="#3A3A3A" stroke-width="1.5"/><text x="115" y="132" text-anchor="middle" font-size="56" font-weight="800" fill="#FFC107" font-family="Georgia, 'Times New Roman', serif">VI</text>
<text x="214" y="88" font-size="13" font-weight="700" letter-spacing="3.5" fill="#9E9E9E">PART VI · CHAPTERS 19–23</text><text x="212" y="134" font-size="40" font-weight="800" letter-spacing="-1" fill="#FFFFFF">Administration</text>
<g class="fl" style="animation-delay:-0.0s"><rect x="214" y="158" width="113" height="26" rx="13" fill="#1E1E1E" stroke="#3A3A3A"/><circle cx="227" cy="171" r="3.5" fill="#FFC107"/><text x="236" y="175.5" font-size="12.5" fill="#E0E0E0">Admin panel</text></g>
<g class="fl" style="animation-delay:-0.5s"><rect x="334.784" y="158" width="105" height="26" rx="13" fill="#1E1E1E" stroke="#3A3A3A"/><circle cx="347.784" cy="171" r="3.5" fill="#FFC107"/><text x="356.784" y="175.5" font-size="12.5" fill="#E0E0E0">Moderation</text></g>
<g class="fl" style="animation-delay:-1.0s"><rect x="448.224" y="158" width="127" height="26" rx="13" fill="#1E1E1E" stroke="#3A3A3A"/><circle cx="461.224" cy="171" r="3.5" fill="#FFC107"/><text x="470.224" y="175.5" font-size="12.5" fill="#E0E0E0">Ride controls</text></g>
<g class="fl" style="animation-delay:-1.5s"><rect x="583.6959999999999" y="158" width="105" height="26" rx="13" fill="#1E1E1E" stroke="#3A3A3A"/><circle cx="596.6959999999999" cy="171" r="3.5" fill="#FFC107"/><text x="605.6959999999999" y="175.5" font-size="12.5" fill="#E0E0E0">KYC review</text></g>
<g class="fl" style="animation-delay:-2.0s"><rect x="697.136" y="158" width="135" height="26" rx="13" fill="#1E1E1E" stroke="#3A3A3A"/><circle cx="710.136" cy="171" r="3.5" fill="#FFC107"/><text x="719.136" y="175.5" font-size="12.5" fill="#E0E0E0">Platform stats</text></g>
</g>
<rect x=".75" y=".75" width="1278.5" height="228.5" rx="24" fill="none" stroke="#9E9E9E" stroke-opacity=".16" stroke-width="1.5"/>
</svg>
