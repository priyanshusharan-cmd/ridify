# Free Render deployment for the API and browser app.
services:
  - type: web
    name: ridify-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        sync: false
  - type: web
    name: ridify
    runtime: static
    buildCommand: bash web-app/build.sh
    staticPublishPath: web-app/dist
    envVars:
      - key: BACKEND_URL
        value: https://ridify-backend.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(self), microphone=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
