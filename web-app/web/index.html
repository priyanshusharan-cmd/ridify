<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Offer or find shared rides, track your journey, and split travel costs with Ridify. Use the app right in your browser.">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ridify">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="shell.css">
  <title>Ridify</title>
</head>
<body>
  <main id="app" aria-label="Ridify ride sharing"></main>
  <div id="loading" role="status" aria-live="polite">
    <img src="favicon.png" width="80" height="80" alt="">
    <h1>Ridify</h1>
    <p id="loading-message">Starting your journey…</p>
    <button id="retry" hidden>Try again</button>
  </div>
  <noscript>Enable JavaScript to use Ridify in your browser.</noscript>
  <script src="startup.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
